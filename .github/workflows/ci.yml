name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.toolchain }} / ${{ matrix.feature_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: stable
            feature_name: default
            feature_args: ""
          - toolchain: stable
            feature_name: no-default-features
            feature_args: --no-default-features
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --locked --all-targets
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: cargo check --locked --all-targets $FEATURE_ARGS

      - name: cargo test --locked --all-targets
        env:
          FEATURE_ARGS: ${{ matrix.feature_args }}
        run: cargo test --locked --all-targets $FEATURE_ARGS

  quality:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --all-targets --all-features
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo clippy --all-targets --no-default-features
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

      - name: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  package:
    name: crate packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo package --locked
        run: cargo package --locked

      - name: List packaged files
        run: cargo package --locked --list
